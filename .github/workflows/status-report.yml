name: Status Report Check

concurrency:
  group: status-report-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  status-report-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install schema validator
        run: python3 -m pip install jsonschema==4.26.0
      - name: Generator regression tests
        run: python3 -m unittest scripts/test_gen_status.py
      - name: Status facts match planning records
        run: python3 scripts/gen_status.py --check-facts
      - name: Vendored schema matches recorded hash
        run: cd status && sha256sum -c status.schema.json.sha256
      - name: Validate status.json against schema 2.0 (vendored copy)
        run: |
          python3 - <<'PY'
          import json, sys
          import jsonschema
          schema = json.load(open("status/status.schema.json"))
          report = json.load(open("status/status.json"))
          jsonschema.Draft202012Validator(schema).validate(report)
          assert report["schema_version"] == "2.0", "unsupported schema_version"
          print("status.json valid; tasks:", len(report["tasks"]))
          PY
