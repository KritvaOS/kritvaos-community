name: Source Header Check

on:
  push:
  pull_request:

jobs:
  source-header-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run source header checker
        run: python3 scripts/lint/check_source_headers.py --mode tracked --strict
