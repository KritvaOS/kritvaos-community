# Kritva device demo configuration (KOS-I3). Format: key=value.
runtime.name=kritva_device_demo

# Deterministic activity: number of steps, and the fault scenario.
demo.ticks=6
demo.inject_fault=true
demo.fault_after_tick=3
demo.command_milli_rad_s=500

# Mock hardware settings (all optional).
left_arm_imu.acceleration.start=0
left_arm_imu.acceleration.step=1
shoulder_motor.command.min_rad_s=-2
shoulder_motor.command.max_rad_s=2
shoulder_motor.position.initial=0
