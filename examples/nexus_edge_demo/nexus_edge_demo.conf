# Kritva Nexus-Edge reference demo configuration (KOS-I4). Format: key=value.
runtime.name=kritva_nexus_edge_demo

# Link timing (milliseconds). It is proposed in HELLO and governs the heartbeats and the timeouts on both sides.
link.heartbeat_period_ms=100
link.heartbeat_timeout_ms=300
link.request_timeout_ms=100
link.pump_quantum_ms=1

# The simulated link and the scenario.
demo.link_latency_ms=1
demo.command_milli_rad_s=500
demo.run_ms=500
demo.hostile_link=true

# Remote device settings: they are sent to the Edge endpoints, which validate and own them.
left_arm_imu.acceleration.start=0
left_arm_imu.acceleration.step=1
shoulder_motor.command.min_rad_s=-2
shoulder_motor.command.max_rad_s=2
shoulder_motor.position.initial=0
