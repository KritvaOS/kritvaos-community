# Kritva demo configuration with an injected sensor failure on tick 3 (KOS-I2 failure run).
runtime.name=kritva_demo
runtime.tick_ms=100

# Simulated application activity: number of deterministic steps (no sleeping).
demo.ticks=10

sensor.enabled=true
# 0 = never fail. Set to N to inject a sensor failure on tick N (see kritva_demo_failure.conf).
sensor.failure_after_ticks=3

controller.enabled=true
controller.gain=2

monitor.enabled=true
